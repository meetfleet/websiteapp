<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Messages · Meetfleet</title>
  <meta name="description" content="Read and reply to your Meetfleet conversations on the web.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://meetfleet.app/messages/">

  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meetfleet">

  <link rel="icon" type="image/png" sizes="64x64" href="../assets/images/light.png">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/images/light.png"
    media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/images/dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="../assets/images/icon.png">

  <link rel="preload" href="../assets/fonts/Aeonik-Pro-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../assets/fonts/Aeonik-Pro-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://sbmeuhzmghaqkclaimid.supabase.co" crossorigin>

  <link rel="stylesheet" href="messages.css">
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       Boot gate — held until the session is confirmed, so a signed-out
       visitor never sees a flash of empty chrome before the redirect.
       ═══════════════════════════════════════════════════════════════════════ -->
  <div class="boot" id="boot">
    <div class="boot-mark" aria-hidden="true">
      <svg width="34" height="33" viewBox="0 0 43 41" fill="none">
        <path
          d="M42.0887 25.854C38.7556 34.4688 30.5921 40.564 21.0436 40.5641C11.4954 40.5639 3.3331 34.4685 0 25.854L4.78332 23.8834C7.36172 30.5478 13.6735 35.2502 21.0436 35.2504C28.4138 35.2504 34.7269 30.548 37.3054 23.8834L42.0887 25.854ZM21.0436 0C30.6896 8.19935e-05 38.5103 7.83896 38.5106 17.5092C38.5106 19.7569 38.0871 21.906 37.3174 23.8804L32.1861 21.8707C30.4424 26.3432 26.103 29.4968 21.0436 29.4969C15.9845 29.4966 11.6463 26.343 9.9026 21.8707L4.77127 23.8804C4.00161 21.906 3.57807 19.7569 3.57807 17.5092C3.57837 7.83912 11.3978 0.000344619 21.0436 0Z"
          fill="#0033FF" />
      </svg>
    </div>
    <p class="boot-text">Loading your messages…</p>
  </div>

  <div class="app" id="app" hidden>

    <!-- ═════════════════════════════════════════════════════════════════════
         Rail — identity and global actions
         ═════════════════════════════════════════════════════════════════════ -->
    <nav class="rail" aria-label="Primary">
      <button class="rail-avatar" type="button" id="rail-avatar" aria-label="Your profile">
        <img id="me-avatar" src="" alt="" width="52" height="52">
      </button>
      <p class="rail-name" id="me-name">…</p>

      <div class="rail-actions">
        <button class="rail-btn is-active" type="button" aria-label="Messages" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </button>

        <button class="rail-btn" type="button" id="btn-refresh" aria-label="Refresh conversations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>

        <a class="rail-btn" href="/" aria-label="Back to meetfleet.app">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
          </svg>
        </a>

        <button class="rail-btn rail-btn-quiet" type="button" id="btn-signout" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </div>

      <span class="rail-status" id="conn-status" data-state="connected" title="Connected"></span>
    </nav>

    <!-- ═════════════════════════════════════════════════════════════════════
         Conversation list
         ═════════════════════════════════════════════════════════════════════ -->
    <section class="list-pane" aria-label="Conversations">
      <div class="list-search">
        <label class="sr-only" for="search-input">Search conversations</label>
        <div class="search-control">
          <input type="search" id="search-input" placeholder="Search conversations" autocomplete="off"
            spellcheck="false">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </div>
      </div>

      <p class="list-heading">Recent chats</p>

      <div class="list-scroll" id="conversation-list" role="list">
        <!-- Skeletons are replaced on first paint; they exist so the pane has
             structure while the inbox loads rather than collapsing to nothing. -->
        <div class="convo-skeleton" aria-hidden="true"></div>
        <div class="convo-skeleton" aria-hidden="true"></div>
        <div class="convo-skeleton" aria-hidden="true"></div>
        <div class="convo-skeleton" aria-hidden="true"></div>
      </div>

      <div class="list-empty is-hidden" id="list-empty">
        <p class="empty-title">No conversations yet</p>
        <p class="empty-body">Start a chat in the Meetfleet app and it will show up here.</p>
      </div>
    </section>

    <!-- ═════════════════════════════════════════════════════════════════════
         Chat pane
         ═════════════════════════════════════════════════════════════════════ -->
    <section class="chat-pane" id="chat-pane" aria-label="Conversation">

      <!-- Nothing selected -->
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </div>
        <p class="empty-title">Pick a conversation</p>
        <p class="empty-body">Your messages stay in sync with the app on your phone.</p>
      </div>

      <!-- An open thread -->
      <div class="chat is-hidden" id="chat">
        <header class="chat-header">
          <button class="chat-back" type="button" id="btn-back" aria-label="Back to conversations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <img class="chat-avatar" id="chat-avatar" src="" alt="" width="46" height="46">

          <div class="chat-identity">
            <p class="chat-name" id="chat-name">…</p>
            <p class="chat-meta" id="chat-meta"></p>
          </div>
        </header>

        <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Messages"></div>

        <!-- Composer -->
        <div class="composer" id="composer">
          <div class="composer-row" id="composer-row">
            <button class="composer-btn" type="button" id="btn-attach" aria-label="Attach a photo or video">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>

            <label class="sr-only" for="composer-input">Type a message</label>
            <textarea id="composer-input" rows="1" placeholder="Type a message" autocomplete="off"
              spellcheck="true" maxlength="4000"></textarea>

            <button class="composer-btn composer-mic" type="button" id="btn-mic" aria-label="Record a voice note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <path d="M12 19v3" />
              </svg>
            </button>

            <button class="composer-btn composer-send is-hidden" type="button" id="btn-send" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2 11 13" />
                <path d="M22 2 15 22l-4-9-9-4z" />
              </svg>
            </button>
          </div>

          <!-- Recording state replaces the row above while the mic is live -->
          <div class="recorder is-hidden" id="recorder">
            <button class="recorder-cancel" type="button" id="btn-rec-cancel" aria-label="Discard recording">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6" />
              </svg>
            </button>
            <span class="recorder-dot" aria-hidden="true"></span>
            <span class="recorder-time" id="rec-time">0:00</span>
            <canvas class="recorder-wave" id="rec-wave" width="480" height="36" aria-hidden="true"></canvas>
            <button class="recorder-send" type="button" id="btn-rec-send" aria-label="Send voice note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2 11 13" />
                <path d="M22 2 15 22l-4-9-9-4z" />
              </svg>
            </button>
          </div>

          <input type="file" id="file-input" accept="image/*,video/*" multiple hidden>
        </div>
      </div>
    </section>
  </div>

  <!-- Full-size image / video viewer -->
  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" type="button" id="viewer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <div class="viewer-stage" id="viewer-stage"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
  </div>

  <script type="module" src="messages.js"></script>
</body>

</html>
